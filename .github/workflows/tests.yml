name: Tests

on:
  push:
    branches:
      - main
    paths:
      - 'flex_menu/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'poetry.lock'
      - '.github/workflows/tests.yml'
  # No paths filter on pull_request: these checks are ruleset-required, and a
  # path-filtered required check never reports on out-of-scope PRs, blocking merge.
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  call-tests:
    uses: django-mvp/shared/.github/workflows/tests.yml@v0.4.1
    with:
      coverage-package: flex_menu
      django-versions: '["5.2", "6.0"]'
      # Test and lint tooling lives in the single (non-optional) dev group via
      # the mvp-shared bundle, so the default `--with test` would fail. Empty
      # args install main + dev + docs, which covers pytest.
      poetry-install-args: ''
    secrets: inherit
