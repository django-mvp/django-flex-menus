# Family Dependabot configuration — materialized into each repo at onboarding.
#
# The load-bearing choice is the grouping: one group per ecosystem matching "*",
# so a cycle's updates arrive as a SINGLE pull request. That is what makes
# auto-merge-dependabot.yml viable — one PR, one set of checks, merged when they
# pass. Partial grouping (a "django*" group, a "dev tools" group, everything else
# loose) opens a PR per package instead, and they accumulate faster than anyone
# merges them. FAIR-DM/fairdm reached thirteen open before onboarding.
#
# `reviewers:` is deliberately absent. GitHub removed that option on 2025-08-08
# (announced 2025-04-29) because it overlapped with code owners; repos still
# carrying it are being silently ignored. Use a CODEOWNERS file if review
# assignment is wanted.
#
# Add a `docker` ecosystem only where a Dockerfile exists. Dependabot's docker
# ecosystem scans Dockerfiles and does NOT read docker-compose.yml, so a docker
# block in a compose-only repo never produces anything.
version: 2
updates:
  # Python dependencies (Poetry)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "chore"
      include: "scope"
    # mvp-shared is a git dependency pinned to a tag. Dependabot's Poetry
    # updater raises `mvp-shared | unknown_error` on it and aborts the whole
    # job ("run update_files", exit 1) — which silently stalls every OTHER
    # Python update in this repo, security ones included. Support for
    # tag-pinned Poetry git deps is recent (dependabot-core #13944) and still
    # buggy, and mvp-shared's tag does not match the version it declares, so
    # Dependabot cannot form a coherent bump. Ignoring it keeps the rest of
    # the group flowing; bump the tag by hand when a shared release lands.
    # Revisit if mvp-shared is ever published to an index.
    ignore:
      - dependency-name: "mvp-shared"
    groups:
      python-dependencies:
        patterns:
          - "*"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      github-actions:
        patterns:
          - "*"
