[project]
name = "django-flex-menus"
version = "0.4.4"
description = "Flexible site menus for Django"
authors = [
    { name = "Samuel Jennings", email = "samuel.scott.jennings@gmail.com" },
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.12,<4.0"
# Only actively supported Django releases: 5.2 LTS and the current stable.
# Widening or narrowing this range is a constitution-level change (Article XII).
dependencies = ["django>=6.1.1", "anytree>2"]
keywords = ["django", "menu", "navigation", "navbar", "sidebar", "anytree"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]

[project.urls]
Homepage = "https://github.com/django-mvp/django-flex-menus"
Repository = "https://github.com/django-mvp/django-flex-menus"
Documentation = "https://django-mvp.github.io/django-flex-menus/"
Issues = "https://github.com/django-mvp/django-flex-menus/issues"

[tool.poetry]
packages = [{ include = "flex_menu" }]
requires-poetry = '>=2.0,<3.0'

[tool.poetry.group.dev.dependencies]
# Family toolchain bundle; the pin tag is the family-standard version. Ships
# ruff, mypy, deptry, pre-commit, pytest, pytest-django, coverage, django-stubs.
mvp-shared = { git = "https://github.com/django-mvp/shared.git", tag = "v0.4.1", extras = [
    "dev",
    "test",
] }

[tool.poetry.group.docs.dependencies]
fairdm-docs = { git = "https://github.com/FAIR-DM/fairdm-docs", extras = [
    "sphinx_book_theme",
] }

[build-system]
requires = ['poetry-core (>=2.0,<3.0)']
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
pythonpath = [".", "tests"]
testpaths = ["tests"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--verbose",
    "--tb=short",
    "-ra",
]

[tool.coverage.report]
skip_empty = true
show_missing = true

[tool.coverage.run]
branch = true
source = ["flex_menu"]

[tool.djlint]
profile = "django"
indent = 2
preserve_leading_space = true
preserve_blank_lines = true
format_attribute_template_tags = true
format_css = true
format_js = true
max_line_length = 120
max_attribute_length = 70
include = "H006,H013,H020,H021,H023,H025,H030,H031"
ignore = "H017"
extension = "html"

# Lint and format are both ruff's: it replaces black (formatting), isort (the I
# rules) and pyupgrade (the UP rules), so those three no longer appear here.
# The family rule set lives in ruff-base.toml, which is copied in rather than
# referenced remotely — `extend` only accepts a local path.
[tool.ruff]
extend = "ruff-base.toml"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "B017", "A001", "RUF059"]
# The example project is a demonstration target, never deployed: its settings
# carry a literal SECRET_KEY on purpose.
"example/*" = ["S101", "S105", "S106"]

[tool.mypy]
files = ["flex_menu"]
disallow_untyped_defs = "False"
disallow_any_unimported = "False"
ignore_missing_imports = "True"
no_implicit_optional = "True"
check_untyped_defs = "False"
warn_return_any = "True"
warn_unused_ignores = "True"
show_error_codes = "True"
exclude = ["docs/", "migrations/", "tests/settings.py"]
mypy_path = "flex_menu/"
plugins = ["mypy_django_plugin.main"]

[tool.django-stubs]
django_settings_module = "tests.settings"
ignore_missing_model_attributes = "True"

[tool.deptry]
extend_exclude = ["tasks.py", "tests/", "example/", "docs/"]

[tool.deptry.per_rule_ignores]
DEP003 = ["flex_menu"]

[tool.forge.docs]
# utils.py holds URL-resolver introspection that menu.py calls and nothing else
# does: it is exported from no __init__, named in no document, and absent from
# the public surface listed in CONSTITUTION.md Article XII. Its names are not
# documentation gaps. Anything genuinely public belongs in one of the modules
# that is not listed here.
exempt-paths = ["flex_menu/utils.py"]
